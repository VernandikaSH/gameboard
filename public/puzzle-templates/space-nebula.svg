      <stop offset="0%" stop-color="#050414"/>
      <stop offset="100%" stop-color="#150a2b"/>
    </linearGradient>
    <radialGradient id="nebula1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8e2de2" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#8e2de2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebula2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2596be" stop-opacity="0.5"/>
